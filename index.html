<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>杜金达 · 转正述职报告</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>
  <!-- 3D粒子背景 -->
  <canvas id="bg-canvas"></canvas>

  <!-- 毛玻璃导航栏 -->
  <nav class="glass-nav">
    <div class="nav-brand">杜金达</div>
    <div class="nav-links">
      <a href="#hero" class="nav-link active">概览</a>
      <a href="#data-dashboard" class="nav-link">数据中心</a>
      <a href="#charts" class="nav-link">图表分析</a>
      <a href="#store-compare" class="nav-link">店铺对比</a>
      <a href="#skills" class="nav-link">能力</a>
      <a href="#timeline" class="nav-link">成长</a>
    </div>
    <div class="nav-right">
      <button class="projection-btn" id="projection-btn" title="大屏投影模式">📺 投影</button>
      <div class="nav-date" id="nav-date"></div>
    </div>
  </nav>

  <!-- 英雄区 -->
  <section id="hero" class="section hero-section">
    <div class="hero-content">
      <div class="hero-badge">客服部 · 售前+售后</div>
      <h1 class="hero-title">
        <span class="title-line">杜金达</span>
        <span class="title-line accent">转正述职报告</span>
      </h1>
      <p class="hero-subtitle">入职 <span id="days-count">0</span> 天 · 接待 <span id="total-inquiries">0</span> 人 · 促成 <span id="total-amount">¥0</span></p>
      <div class="hero-stats" id="hero-stats"></div>
    </div>
    <div class="scroll-hint">
      <span>向下滚动</span>
      <div class="scroll-arrow"></div>
    </div>
  </section>

  <!-- 数据中心（日/周/月切换） -->
  <section id="data-dashboard" class="section dashboard-section">
    <div class="section-header">
      <h2 class="section-title">数据中心</h2>
      <p class="section-subtitle">多维度数据查看与分析</p>
    </div>

    <!-- 时间维度切换 -->
    <div class="time-toggle" id="time-toggle">
      <button class="toggle-btn active" data-period="day">日</button>
      <button class="toggle-btn" data-period="week">周</button>
      <button class="toggle-btn" data-period="month">月</button>
    </div>

    <!-- 日期选择器 -->
    <div class="date-selector" id="date-selector"></div>

    <!-- 数据概览卡片 -->
    <div class="dashboard-cards" id="dashboard-cards"></div>

    <!-- 自动分析 -->
    <div class="analysis-panel" id="analysis-panel"></div>
  </section>

  <!-- 图表分析 -->
  <section id="charts" class="section charts-section">
    <div class="section-header">
      <h2 class="section-title">趋势分析</h2>
      <p class="section-subtitle">数据可视化与趋势洞察</p>
    </div>
    <div class="charts-grid">
      <div class="chart-card">
        <h3>接待量趋势</h3>
        <canvas id="chart-inquiries"></canvas>
      </div>
      <div class="chart-card">
        <h3>促成金额趋势</h3>
        <canvas id="chart-amount"></canvas>
      </div>
      <div class="chart-card">
        <h3>满意度变化</h3>
        <canvas id="chart-satisfaction"></canvas>
      </div>
      <div class="chart-card">
        <h3>响应时长变化</h3>
        <canvas id="chart-response"></canvas>
      </div>
    </div>
  </section>

  <!-- 店铺对比 -->
  <section id="store-compare" class="section compare-section">
    <div class="section-header">
      <h2 class="section-title">店铺对比</h2>
      <p class="section-subtitle">各店铺绩效横向对比</p>
    </div>
    <div class="compare-table-wrapper" id="compare-table-wrapper"></div>
    <div class="charts-grid">
      <div class="chart-card">
        <h3>各店铺接待量占比</h3>
        <canvas id="chart-store-inquiries"></canvas>
      </div>
      <div class="chart-card">
        <h3>各店铺促成金额占比</h3>
        <canvas id="chart-store-amount"></canvas>
      </div>
    </div>
  </section>

  <!-- 能力评估 -->
  <section id="skills" class="section skills-section">
    <div class="section-header">
      <h2 class="section-title">能力评估</h2>
      <p class="section-subtitle">客服核心技能掌握程度</p>
    </div>
    <div class="skills-container">
      <div class="skills-radar" id="skills-radar"></div>
      <div class="skills-list" id="skills-list"></div>
    </div>
  </section>

  <!-- 成长时间轴 -->
  <section id="timeline" class="section timeline-section">
    <div class="section-header">
      <h2 class="section-title">成长轨迹</h2>
      <p class="section-subtitle">入职以来的重要节点</p>
    </div>
    <div class="timeline" id="timeline"></div>
  </section>

  <!-- 页脚 -->
  <footer class="glass-footer">
    <p>© 2026 杜金达 | 基于数据驱动的智能客服解决方案</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
